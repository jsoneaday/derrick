name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no secrets in git history
        run: chmod +x scripts/verify-no-secrets.sh && ./scripts/verify-no-secrets.sh --history

  unit-tests:
    runs-on: xcode-27
    needs: secrets
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Unit test Swift packages
        run: chmod +x scripts/ci-unit-tests.sh && ./scripts/ci-unit-tests.sh
