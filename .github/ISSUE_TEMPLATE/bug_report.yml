name: Bug report
description: Report a problem with Derrick
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Messaging\n2. …"
  - type: input
    id: version
    attributes:
      label: macOS / Xcode version
  - type: checkboxes
    id: secrets
    attributes:
      label: Submission checklist
      options:
        - label: I did not paste API keys, tokens, or `.env` contents
          required: true
